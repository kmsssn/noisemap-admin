<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NoiseWatch icon">
  <defs>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="38%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Pin body: classic map-pin teardrop -->
  <path filter="url(#softShadow)" fill="url(#pinGrad)"
        d="M256 36
           C156 36 76 116 76 216
           C76 332 220 446 248 470
           a12 12 0 0 0 16 0
           C292 446 436 332 436 216
           C436 116 356 36 256 36 Z"/>

  <!-- Glossy highlight -->
  <path fill="url(#gloss)"
        d="M256 36
           C156 36 76 116 76 216
           C76 332 220 446 248 470
           a12 12 0 0 0 16 0
           C292 446 436 332 436 216
           C436 116 356 36 256 36 Z"/>

  <!-- Eye (watch) above the wave -->
  <g transform="translate(256 138)">
    <path d="M-42 0 C-25 -24 25 -24 42 0 C25 24 -25 24 -42 0 Z"
          fill="#ecfdf5" opacity="0.95"/>
    <circle cx="0" cy="0" r="13" fill="#065f46"/>
    <circle cx="-4" cy="-4" r="4.5" fill="#ecfdf5"/>
  </g>

  <!-- Audio waveform (noise) -->
  <g stroke="#ecfdf5" stroke-width="16" stroke-linecap="round" fill="none">
    <line x1="148" y1="232" x2="148" y2="248"/>
    <line x1="177" y1="216" x2="177" y2="264"/>
    <line x1="206" y1="198" x2="206" y2="282"/>
    <line x1="232" y1="180" x2="232" y2="300"/>
    <line x1="256" y1="164" x2="256" y2="316"/>
    <line x1="280" y1="188" x2="280" y2="292"/>
    <line x1="306" y1="204" x2="306" y2="276"/>
    <line x1="335" y1="220" x2="335" y2="260"/>
    <line x1="364" y1="233" x2="364" y2="247"/>
  </g>
</svg>
